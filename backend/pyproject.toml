[project]
name = "birthday-backend"
version = "1.0.0"
description = "FastAPI backend for Cinematic Birthday experience"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
]

[tool.vercel]
entrypoint = "app.main:app"
