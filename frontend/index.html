<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c9922a" />
    <title>Happy Birthday — A Cinematic Experience</title>
    <meta name="description" content="A breathtaking cinematic birthday story created with love, just for Dhanya ✨" />

    <!--
      Open Graph / Twitter card meta tags.
      og:image and twitter:image use the absolute Vercel deployment URL.
      Social crawlers (WhatsApp, Facebook, Telegram, Twitter/X) require absolute URLs.
      Update the domain below if your Vercel project URL changes.
    -->

    <!-- ── Open Graph (WhatsApp / Facebook / Telegram previews) ── -->
    <meta property="og:type"             content="website" />
    <meta property="og:title"            content="Happy Birthday Dhanya 👑✨" />
    <meta property="og:description"      content="A cinematic birthday experience crafted with love, just for you. Open to begin the story..." />
    <meta property="og:image"            content="https://techstack-psi.vercel.app/favicon.png" />
    <meta property="og:image:secure_url" content="https://techstack-psi.vercel.app/favicon.png" />
    <meta property="og:image:width"      content="512" />
    <meta property="og:image:height"     content="512" />
    <meta property="og:image:type"       content="image/png" />
    <meta property="og:image:alt"        content="Happy Birthday Dhanya — A Cinematic Experience" />
    <meta property="og:url"              content="https://techstack-psi.vercel.app" />
    <meta property="og:site_name"        content="Happy Birthday — A Cinematic Experience" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Happy Birthday Dhanya 👑✨" />
    <meta name="twitter:description" content="A cinematic birthday experience crafted with love, just for you." />
    <meta name="twitter:image"       content="https://techstack-psi.vercel.app/favicon.png" />
    <meta name="twitter:image:alt"   content="Happy Birthday Dhanya — A Cinematic Experience" />
    <meta name="twitter:url"         content="https://techstack-psi.vercel.app" />

    <!-- Canonical URL for SEO -->
    <link rel="canonical" href="https://techstack-psi.vercel.app" />

    <!-- Preconnect for Google Fonts performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
